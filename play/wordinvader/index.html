<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Play Word Invader · GameOdyssey</title>
  <meta name="description" content="Play Word Invader free in your browser. A side-scrolling space shoot 'em up that isn't for the faint-hearted.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#111214">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="stylesheet" href="../../assets/css/play.css?v=mtod186w">
  <script type="module" crossorigin src="./assets/index-Ct17hlLW.js"></script>
</head>
<body>
  <header class="play-bar">
    <a class="play-bar__back" href="../../games/word-invader.html">&larr; Back to GameOdyssey</a>
    <span class="play-bar__title">Word Invader</span>
    <button type="button" class="play-bar__btn" id="html5-fullscreen-button">Fullscreen</button>
  </header>

  <main class="play-stage">
    <div id="game" class="html5-game" style="--w:1374;--h:990"></div>
    <p class="play-note">Best played on a desktop or laptop with a keyboard. Click the game once so it can receive key presses.</p>
  </main>

  <script>
    (function () {
      var stage = document.getElementById("game");
      var btn = document.getElementById("html5-fullscreen-button");
      if (!stage.requestFullscreen) { btn.hidden = true; return; }
      btn.addEventListener("click", function () {
        if (document.fullscreenElement) document.exitFullscreen();
        else stage.requestFullscreen();
      });
      document.addEventListener("fullscreenchange", function () {
        btn.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
        // Phaser's FIT scaler re-measures its parent on window resize.
        window.dispatchEvent(new Event("resize"));
      });
    })();
  </script>
</body>
</html>
