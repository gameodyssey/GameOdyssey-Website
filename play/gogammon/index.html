<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Play GO Backgammon · GameOdyssey</title>
  <meta name="description" content="Play GO Backgammon free in your browser. The oldest game in history on GO's stunning tables.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#08200f">
  <link rel="icon" href="../../favicon.ico" sizes="any">
  <link rel="stylesheet" href="../../assets/css/play.css?v=mtod186w">
  <style>
    html, body { height: 100%; overflow: hidden; background: #08200f; }
    #app { position: fixed; top: 52px; left: 0; right: 0; bottom: 0; touch-action: none; -webkit-user-select: none; user-select: none; }
    #app:fullscreen { top: 0; }
    #three { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #game { position: absolute; inset: 0; }
    #game canvas { position: absolute; left: 0; top: 0; }
  </style>
  <script type="module" crossorigin src="./assets/index-BaBsAtXE.js"></script>
</head>
<body class="play-fill">
  <header class="play-bar">
    <a class="play-bar__back" href="../../games/backgammon.html">&larr; Back to GameOdyssey</a>
    <span class="play-bar__title">GO Backgammon</span>
    <button type="button" class="play-bar__btn" id="html5-fullscreen-button">Fullscreen</button>
  </header>
  <div id="app">
    <canvas id="three"></canvas>
    <div id="game"></div>
  </div>
  <script>
    (function () {
      var stage = document.getElementById("app");
      var btn = document.getElementById("html5-fullscreen-button");
      if (!stage.requestFullscreen) { btn.hidden = true; return; }
      btn.addEventListener("click", function () {
        if (document.fullscreenElement) document.exitFullscreen();
        else stage.requestFullscreen();
      });
      document.addEventListener("fullscreenchange", function () {
        btn.textContent = document.fullscreenElement ? "Exit fullscreen" : "Fullscreen";
        // The game re-measures its container on window resize.
        window.dispatchEvent(new Event("resize"));
      });
    })();
  </script>
</body>
</html>
